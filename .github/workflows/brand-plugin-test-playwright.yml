name: Build and Test Module Updates in Brand Plugins (Playwright tests)
on:
  pull_request:
    types: [ opened, reopened, ready_for_review, synchronize ]
    branches:
      - main-networksolutions
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.extract_branch.outputs.branch }}
    steps:

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

  netsol:
    name: Netsol Build and Test Playwright
    needs: setup
    permissions:
      contents: read
    uses: newfold-labs/workflows/.github/workflows/module-plugin-test-playwright.yml@main
    with:
      module-repo: ${{ github.repository }}
      module-branch: ${{ needs.setup.outputs.branch }}
      plugin-repo: 'newfold-labs/wp-plugin-web'
    secrets: inherit

  netsol-dev:
    name: Netsol Dev Build and Test Playwright
    needs: setup
    permissions:
      contents: read
    uses: newfold-labs/workflows/.github/workflows/module-plugin-test-playwright.yml@main
    with:
      module-repo: ${{ github.repository }}
      module-branch: ${{ needs.setup.outputs.branch }}
      plugin-repo: 'newfold-labs/wp-plugin-web'
      plugin-branch: 'develop'
      artifact-name: 'wp-plugin-web-develop'
    secrets: inherit
  vodien:
    name: Vodien Build and Test Playwright
    needs: setup
    permissions:
      contents: read
    uses: newfold-labs/workflows/.github/workflows/module-plugin-test-playwright.yml@main
    with:
      module-repo: ${{ github.repository }}
      module-branch: ${{ needs.setup.outputs.branch }}
      plugin-repo: 'newfold-labs/wp-plugin-vodien'
    secrets: inherit

  vodien-dev:
    name: Vodien Dev Build and Test Playwright
    needs: setup
    permissions:
      contents: read
    uses: newfold-labs/workflows/.github/workflows/module-plugin-test-playwright.yml@main
    with:
      module-repo: ${{ github.repository }}
      module-branch: ${{ needs.setup.outputs.branch }}
      plugin-repo: 'newfold-labs/wp-plugin-vodien'
      plugin-branch: 'dev/hostingdev/4647'
      artifact-name: 'wp-plugin-vodien-develop'
    secrets: inherit
