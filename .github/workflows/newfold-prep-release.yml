name: Newfold Prepare Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'The level of release to be used.'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
        default: 'patch'
        required: true
      # Release line: v3 (LTS) or main (current/v4) or main-networksolutions (current for Networksolutions).
      module-branch:
        description: 'Branch to check out, bump, and open the release PR against (v3 for LTS, main for latest).'
        type: choice
        options:
          - 'main'
          - 'v3'
          - 'main-networksolutions'
        default: 'main'
        required: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:

  # This job runs the newfold module-prep-release workflow for this module.
  prep-release:
    name: Prepare Release
    uses: newfold-labs/workflows/.github/workflows/reusable-module-prep-release.yml@main
    permissions:
      contents: write      # Required for the reusable workflow to push the release branch and version-bump commits with GITHUB_TOKEN.
      pull-requests: write # Required for the reusable workflow to create the draft release pull request with gh.
    timeout-minutes: 30
    with:
      module-repo: ${{ github.repository }}
      module-branch: ${{ inputs.module-branch }}
      level: ${{ inputs.level }}
      json-file: 'package.json'
      php-file: 'bootstrap.php'
